<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Đề Thi</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện LaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div id="admin-panel" style="display:none; max-width: 800px; margin: auto; padding: 20px;">
        <h1 style="text-align: center; color: #8ab4f8;">Tạo đề thi mới</h1>
        <input type="text" id="quiz-title" placeholder="Nhập tên Đề thi (VD: Kiểm tra 15p Toán Hình)..." style="width: 100%; padding: 12px; margin-bottom: 20px; font-size: 16px; border-radius: 8px;">
        
        <div class="card">
            <select id="question-type" style="width: 100%; padding: 10px; margin-bottom: 15px; font-size: 16px;">
                <option value="trac-nghiem">Trắc nghiệm 1 đáp án</option>
                <option value="dung-sai">Trắc nghiệm Đúng/Sai</option>
                <option value="tra-loi-ngan">Câu hỏi Trả lời ngắn</option>
            </select>
            
            <textarea id="question" placeholder="Nhập câu hỏi (Bao công thức trong $$, VD: $$2SO_2$$)" rows="4" style="width: 100%; margin-bottom: 15px; font-size: 15px; padding: 10px;"></textarea>
            
            <div id="trac-nghiem-group">
                <input type="text" id="opt-a" placeholder="Đáp án A" style="margin-bottom: 5px;"><br>
                <input type="text" id="opt-b" placeholder="Đáp án B" style="margin-bottom: 5px;"><br>
                <input type="text" id="opt-c" placeholder="Đáp án C" style="margin-bottom: 5px;"><br>
                <input type="text" id="opt-d" placeholder="Đáp án D" style="margin-bottom: 10px;"><br>
                <label style="color: #e8eaed; margin-right: 10px;">Đáp án đúng:</label>
                <input type="radio" name="correct-answer" value="0"> A
                <input type="radio" name="correct-answer" value="1"> B
                <input type="radio" name="correct-answer" value="2"> C
                <input type="radio" name="correct-answer" value="3"> D
            </div>
            
            <div id="dung-sai-group" style="display:none; color: #e8eaed;">
                <div style="margin-bottom: 8px;">A. <input type="text" id="ds-opt-a" style="width: 80%;"><input type="checkbox" id="ds-ans-a" style="margin-left: 10px;"> Đúng</div>
                <div style="margin-bottom: 8px;">B. <input type="text" id="ds-opt-b" style="width: 80%;"><input type="checkbox" id="ds-ans-b" style="margin-left: 10px;"> Đúng</div>
                <div style="margin-bottom: 8px;">C. <input type="text" id="ds-opt-c" style="width: 80%;"><input type="checkbox" id="ds-ans-c" style="margin-left: 10px;"> Đúng</div>
                <div style="margin-bottom: 8px;">D. <input type="text" id="ds-opt-d" style="width: 80%;"><input type="checkbox" id="ds-ans-d" style="margin-left: 10px;"> Đúng</div>
            </div>
            
            <div id="tra-loi-ngan-group" style="display:none;">
                <input type="text" id="answer-key" placeholder="Nhập đáp án chính xác (VD: 5, x=2)" style="width: 100%; padding: 10px;">
            </div>
            
            <button id="btn-add" style="margin-top: 15px; width: 100%; padding: 12px; font-size: 16px;">Thêm câu hỏi này</button>
        </div>

        <div id="preview-area"></div>
        <button id="btn-save" style="margin-top: 20px; width: 100%; background: #4caf50; padding: 15px; font-size: 18px;">Lưu đề thi và tạo Link</button>
        <div id="link-result" style="margin-top: 15px; text-align: center;"></div>
    </div>

    <div id="quiz-panel" style="display:none; max-width: 800px; margin: auto; padding: 20px;">
        <div id="quiz-content"></div>
    </div>

    <div id="leaderboard-panel" style="display:none; max-width: 800px; margin: auto; padding: 20px;">
        <div id="leaderboard-content"></div>
        <button onclick="location.reload()" style="margin-top: 20px; width: 100%; background: #5f6368; padding: 12px; border-radius: 8px; color: white; border: none; cursor: pointer;">Tạo bài tập khác</button>
    </div>

    <script type="module" src="script.js?v=13"></script>
</body>
</html>
