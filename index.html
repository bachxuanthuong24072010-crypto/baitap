<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Câu Hỏi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div id="admin-panel" style="display:none;">
        <h2>Tạo câu hỏi</h2>
        
        <!-- Khu vực nhập thủ công từng câu -->
        <div style="border: 1px solid #5f6368; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top: 0;">1. Nhập thủ công từng câu:</h3>
            <select id="question-type" style="width:100%; margin-bottom:10px; padding:10px; background:#303134; color:white; border-radius:8px;">
                <option value="trac-nghiem">Trắc nghiệm</option>
                <option value="dung-sai">Đúng / Sai</option>
                <option value="tu-luan">Tự luận / Trả lời ngắn</option>
            </select>

            <textarea id="question" placeholder="Nhập câu hỏi (Bao công thức trong $$, VD: $$2SO_2$$)"></textarea>
            
            <div id="trac-nghiem-group">
                <div style="background: #202124; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <label style="color: #4caf50; font-weight: bold; cursor: pointer; display: flex; align-items: center;">
                        <input type="radio" name="correct-answer" value="0" checked style="width: auto; margin: 0 10px 0 0;"> ĐÁP ÁN A ĐÚNG
                    </label>
                    <input type="text" id="opt-a" placeholder="Nội dung đáp án A" style="margin-top: 8px;">
                    <textarea id="exp-a" placeholder="Giải thích đáp án A (ẩn)"></textarea>
                </div>
                <div style="background: #202124; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <label style="color: #4caf50; font-weight: bold; cursor: pointer; display: flex; align-items: center;">
                        <input type="radio" name="correct-answer" value="1" style="width: auto; margin: 0 10px 0 0;"> ĐÁP ÁN B ĐÚNG
                    </label>
                    <input type="text" id="opt-b" placeholder="Nội dung đáp án B" style="margin-top: 8px;">
                    <textarea id="exp-b" placeholder="Giải thích đáp án B (ẩn)"></textarea>
                </div>
                <div style="background: #202124; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <label style="color: #4caf50; font-weight: bold; cursor: pointer; display: flex; align-items: center;">
                        <input type="radio" name="correct-answer" value="2" style="width: auto; margin: 0 10px 0 0;"> ĐÁP ÁN C ĐÚNG
                    </label>
                    <input type="text" id="opt-c" placeholder="Nội dung đáp án C" style="margin-top: 8px;">
                    <textarea id="exp-c" placeholder="Giải thích đáp án C (ẩn)"></textarea>
                </div>
                <div style="background: #202124; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <label style="color: #4caf50; font-weight: bold; cursor: pointer; display: flex; align-items: center;">
                        <input type="radio" name="correct-answer" value="3" style="width: auto; margin: 0 10px 0 0;"> ĐÁP ÁN D ĐÚNG
                    </label>
                    <input type="text" id="opt-d" placeholder="Nội dung đáp án D" style="margin-top: 8px;">
                    <textarea id="exp-d" placeholder="Giải thích đáp án D (ẩn)"></textarea>
                </div>
            </div>

            <div id="dung-sai-group" style="display: none;">
                <div style="background: #202124; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <label style="color: #4caf50; font-weight: bold; cursor: pointer; display: flex; align-items: center;">
                        <input type="radio" name="tf-correct" value="0" checked style="width: auto; margin: 0 10px 0 0;"> ĐÚNG
                    </label>
                    <textarea id="exp-tf-true" placeholder="Giải thích (ẩn)"></textarea>
                </div>
                <div style="background: #202124; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    <label style="color: #f44336; font-weight: bold; cursor: pointer; display: flex; align-items: center;">
                        <input type="radio" name="tf-correct" value="1" style="width: auto; margin: 0 10px 0 0;"> SAI
                    </label>
                    <textarea id="exp-tf-false" placeholder="Giải thích (ẩn)"></textarea>
                </div>
            </div>

            <div id="tu-luan-group" style="display: none;">
                <textarea id="answer-key" placeholder="Nhập đáp án đúng hoặc gợi ý chấm..."></textarea>
            </div>

            <button id="btn-add">Thêm câu hỏi này vào bộ đề</button>
        </div>

        <!-- Khu vực nhập nhanh bóc tách tự động -->
        <div style="border: 1px solid #5f6368; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top: 0;">2. Hoặc nhập nhanh nhiều câu (Dán từ AI):</h3>
            <textarea id="bulk-input" rows="8" placeholder="Câu 1: 1+1=?
*A. 2
B. 3
C. 4
D. 5
HD: Vì một thêm một là hai."></textarea>
            <button id="btn-preview" style="background-color: #fbbc04;">Bóc tách & Xem trước</button>
            
            <div id="preview-area" style="margin-top: 15px;"></div>
        </div>

        <button id="btn-save" style="background-color: #4caf50; color: white; padding: 15px; font-size: 18px;">LƯU TOÀN BỘ & TẠO LINK</button>
        <p id="link-result"></p>
    </div>

    <!-- Khu vực làm bài -->
    <div id="quiz-panel" style="display:none;">
        <div id="quiz-content"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
